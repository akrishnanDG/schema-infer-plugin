[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-infer"
version = "1.4.5"
description = "Automatically infer and generate schemas from Kafka topic data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Arun Krishnan"},
]
keywords = ["kafka", "schema", "avro", "protobuf", "json-schema", "confluent", "schema-registry", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

dependencies = [
    "confluent-kafka~=2.3",
    "click~=8.0",
    "pydantic~=2.0",
    "jsonschema~=4.0",
    "protobuf~=4.0",
    "tqdm~=4.64",
    "pyyaml~=6.0",
    "requests~=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
schema-infer = "schema_infer.plugin.cli:main"

[project.urls]
Homepage = "https://github.com/akrishnanDG/schema-infer-plugin"
Repository = "https://github.com/akrishnanDG/schema-infer-plugin"
Documentation = "https://github.com/akrishnanDG/schema-infer-plugin/blob/main/DOCUMENTATION.md"
"Bug Tracker" = "https://github.com/akrishnanDG/schema-infer-plugin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["schema_infer*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["schema_infer"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
